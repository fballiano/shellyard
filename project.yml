name: Shellyard

options:
  bundleIdPrefix: com.fabrizioballiano
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 2.2.2026110702
  ShellyardModel:
    path: Packages/ShellyardModel
  ShellyardVault:
    path: Packages/ShellyardVault
  ShellyardSSH:
    path: Packages/ShellyardSSH
  ShellyardImport:
    path: Packages/ShellyardImport
  ShellyardSFTP:
    path: Packages/ShellyardSFTP

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.1.2"
    CURRENT_PROJECT_VERSION: "13"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Shellyard:
    type: application
    platform: macOS
    sources:
      - path: Shellyard
    dependencies:
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: GhosttyKit
        product: GhosttyTheme
      - package: ShellyardModel
        product: ShellyardModel
      - package: ShellyardVault
        product: ShellyardVault
      - package: ShellyardSSH
        product: ShellyardSSH
      - package: ShellyardImport
        product: ShellyardImport
      - package: ShellyardSFTP
        product: ShellyardSFTP
      - target: shellyard-askpass
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: shellyard-cli
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        # Until 1.4.0 the identifier was com.fabrizioballiano.Termora, the
        # old name of the app. LegacyMigration copies its settings.
        PRODUCT_BUNDLE_IDENTIFIER: com.fabrizioballiano.Shellyard
        PRODUCT_NAME: Shellyard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Shellyard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shellyard/Resources/Shellyard.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  shellyard-askpass:
    type: tool
    platform: macOS
    sources:
      - path: Tools/shellyard-askpass/main.swift
      - path: Packages/ShellyardSSH/Sources/ShellyardSSH/AskpassClient.swift
    settings:
      base:
        PRODUCT_NAME: shellyard-askpass
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES

  shellyard-cli:
    type: tool
    platform: macOS
    sources:
      - path: Tools/shellyard-cli/main.swift
      - path: Packages/ShellyardSSH/Sources/ShellyardSSH/AgentProtocol.swift
    settings:
      base:
        # Not "shellyard": the disk is case-insensitive, so a tool named
        # `shellyard` in Contents/MacOS overwrites the app binary
        # `Shellyard` and the application stops launching. The cask links
        # it as `shellyard`.
        PRODUCT_NAME: shellyard-cli
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES

  ShellyardUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ShellyardUITests
    dependencies:
      - target: Shellyard
      - package: ShellyardModel
        product: ShellyardModel
      - package: ShellyardVault
        product: ShellyardVault
      - package: ShellyardSSH
        product: ShellyardSSH
      - package: ShellyardImport
        product: ShellyardImport
      - package: ShellyardSFTP
        product: ShellyardSFTP
      - target: shellyard-askpass
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabrizioballiano.ShellyardUITests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_TARGET_NAME: Shellyard
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Shellyard:
    build:
      targets:
        Shellyard: all
        ShellyardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShellyardUITests
