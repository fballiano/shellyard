name: Release

# A tag `v*` builds Shellyard, signs it with the Developer ID certificate,
# has Apple notarize it, publishes a GitHub release with the zip, and points
# the cask Casks/shellyard.rb in fballiano/homebrew-tap at it:
#
#   brew tap fballiano/tap
#   brew trust --tap fballiano/tap
#   brew install --cask shellyard
#
# Casks/termora.rb in this repository is the cask of the old tap. It is
# frozen and deprecated, and this workflow does not change it.
#
# Run it by hand (Actions -> Release -> Run workflow) for a dry run: it
# signs and notarizes, keeps the zip as a workflow artifact, and publishes
# nothing.
#
# What it needs, set once in the repository settings (see
# Scripts/setup-signing.sh):
#
#   variable  APPLE_TEAM_ID                the ten-character Team ID
#   secret    DEVELOPER_ID_P12_BASE64      the Developer ID Application
#                                          certificate and its key, .p12,
#                                          in base64
#   secret    DEVELOPER_ID_P12_PASSWORD    the password of that .p12
#   secret    NOTARY_KEY_P8_BASE64         an App Store Connect API key,
#                                          .p8, in base64
#   secret    NOTARY_KEY_ID                the ID of that key
#   secret    NOTARY_ISSUER_ID             the issuer ID of that key
#   secret    TAP_DEPLOY_KEY               a deploy key with write access
#                                          to fballiano/homebrew-tap

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP: build/Build/Products/Release/Shellyard.app
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # A keychain of its own, for this run only. The certificate never
      # touches the disk outside the runner's temporary folder.
      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$P12_BASE64" ]; then
            echo "::error::APPLE_TEAM_ID or DEVELOPER_ID_P12_BASE64 is not set. See Scripts/setup-signing.sh."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # The current list, word by word: the paths hold no spaces.
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # The settings on the command line apply to every target, so the two
      # tools inside the bundle get the same signature, the hardened
      # runtime, and a secure timestamp. Notarization refuses an executable
      # without any one of them. Xcode must not inject its base
      # entitlements: with them comes get-task-allow, which notarization
      # also refuses. project.yml keeps ad-hoc signing for local builds.
      - name: Build and sign
        run: |
          xcodegen generate
          xcodebuild -project Termora.xcodeproj -scheme Termora \
                     -configuration Release \
                     -destination 'platform=macOS,arch=arm64' \
                     -derivedDataPath build \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Developer ID Application" \
                     DEVELOPMENT_TEAM="$TEAM_ID" \
                     OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN" \
                     ENABLE_HARDENED_RUNTIME=YES \
                     CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
                     build

      - name: Check the signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          for binary in "$APP"/Contents/MacOS/*; do
            echo "== $binary"
            details="$(codesign -dvv "$binary" 2>&1)"
            echo "$details" | grep -E "Authority=Developer ID Application|TeamIdentifier|flags|Timestamp"
            echo "$details" | grep -q "TeamIdentifier=$TEAM_ID" \
              || { echo "::error::$binary is not signed by team $TEAM_ID"; exit 1; }
            echo "$details" | grep -q "(runtime)" \
              || { echo "::error::$binary has no hardened runtime"; exit 1; }
            echo "$details" | grep -q "^Timestamp=" \
              || { echo "::error::$binary has no secure timestamp"; exit 1; }
            if grep -q "get-task-allow" \
                 <<< "$(codesign -d --entitlements :- "$binary" 2>/dev/null)"; then
              echo "::error::$binary carries get-task-allow"; exit 1
            fi
          done

      # A restricted entitlement with no provisioning profile gets a program
      # killed at launch (exit 137), and the tools are only ever run by
      # other programs, so nobody would see it. Start both here.
      - name: Start the tools
        run: |
          "$APP/Contents/MacOS/shellyard-cli" --help > /dev/null
          set +e
          "$APP/Contents/MacOS/termora-askpass" probe < /dev/null
          STATUS=$?
          set -e
          # With no socket to ask, the helper exits 1. 128 and up is a signal.
          if [ $STATUS -ge 128 ]; then
            echo "::error::termora-askpass was killed at launch (exit $STATUS)"
            exit 1
          fi

      # notarytool waits for Apple's answer. On a refusal, it prints the
      # log, which names every file and the reason.
      - name: Notarize
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          set +e
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json"
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/notary.json"
          ID="$(plutil -extract id raw "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          RESULT="$(plutil -extract status raw "$RUNNER_TEMP/notary.json" 2>/dev/null || true)"
          if [ $STATUS -ne 0 ] || [ "$RESULT" != "Accepted" ]; then
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" \
                --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
            fi
            rm -f "$KEY"
            echo "::error::Notarization did not succeed: ${RESULT:-no answer}"
            exit 1
          fi
          rm -f "$KEY"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package
        id: package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dry-run-$(git rev-parse --short HEAD)"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Shellyard-$VERSION.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "Shellyard-$VERSION.zip" | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

      - name: Keep the dry-run zip
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Shellyard-${{ steps.package.outputs.version }}
          path: Shellyard-${{ steps.package.outputs.version }}.zip

      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Shellyard-${{ steps.package.outputs.version }}.zip" \
            --title "Shellyard ${{ steps.package.outputs.version }}" \
            --generate-notes

      # The cask lives in fballiano/homebrew-tap. The secret TAP_DEPLOY_KEY is
      # a deploy key with write access to that repository only.
      - name: Check out the Homebrew tap
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: fballiano/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Point the cask at the release
        if: github.event_name == 'push'
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          VERSION="${{ steps.package.outputs.version }}"
          SHA="${{ steps.package.outputs.sha256 }}"
          sed -i '' \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$SHA\"|" \
            Casks/shellyard.rb
          if git diff --quiet; then
            echo "The tap already holds version $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Point shellyard at $VERSION" -- Casks/shellyard.rb
          # Another application can push to the tap at the same time.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          fi
